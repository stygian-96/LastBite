services:
  db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lastbite
      POSTGRES_PASSWORD: lastbite
      POSTGRES_DB: lastbite
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastbite -d lastbite_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
