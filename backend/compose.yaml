services:
  db:
    image: postgres:16
    # Dev and test only: durability is traded for speed. Never use these flags in production.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lastbite
      POSTGRES_PASSWORD: lastbite
      POSTGRES_DB: lastbite
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastbite -d lastbite_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
